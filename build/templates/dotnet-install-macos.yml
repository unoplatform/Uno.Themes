parameters:
  # Keep in sync with UnoCheck_Version: installing wasm-tools pins the mono.toolchain.current
  # manifest to the SDK uno.check ships for (1.34.1 -> 10.0.101). On a newer SDK the workload
  # resolver still asks for that SDK's Microsoft.NET.Runtime.MonoTargets.Sdk, which uno.check
  # never installed, and the net10.0 library builds fail with NETSDK1147.
  DotNetVersion: '10.0.101'
  UnoCheck_Version: '1.34.1'
  Dotnet_Root: '/usr/local/share/dotnet/'
  Dotnet_Tools: '~/.dotnet/tools'
  UnoCheckParameters: ''

steps:
  - task: UseDotNet@2
    displayName: 'Use .NET Core SDK 6.0.300'
    retryCountOnTaskFailure: 3
    inputs:
      packageType: sdk
      version: 6.0.300
      includePreviewVersions: true

  - task: UseDotNet@2
    displayName: install .NET 3.1
    retryCountOnTaskFailure: 3
    inputs:
      version: 3.1.x
      installationPath: ${{ parameters.Dotnet_Root }}
      
  - task: UseDotNet@2
    displayName: 'Use .NET Core SDK ${{ parameters.DotNetVersion }}'
    retryCountOnTaskFailure: 3
    inputs:
      packageType: sdk
      version: ${{ parameters.DotNetVersion }}
      includePreviewVersions: true

  - template: jdk-setup.yml

  - bash: |
      dotnet tool update --global uno.check --version ${{ parameters.UnoCheck_Version }} --add-source https://api.nuget.org/v3/index.json
      uno-check --ci --non-interactive --fix --skip androidsdk --skip androidemulator --skip gtk3 --skip xcode --skip vswin --skip vsmac ${{ parameters.UnoCheckParameters }}
    displayName: Install .NET Workloads
    retryCountOnTaskFailure: 3
