jobs:
- job: RuntimeTests_Desktop
  cancelTimeoutInMinutes: 0
  displayName: 'Runtime Tests - Desktop'
  timeoutInMinutes: 60

  pool:
    vmImage: 'ubuntu-latest'

  strategy:
    matrix:
      Material:
        SampleAppName: MaterialSampleApp
        ProjectPath: src/samples/MaterialSampleApp
      Simple:
        SampleAppName: SimpleSampleApp
        ProjectPath: src/samples/SimpleSampleApp

  variables:
    ArtifactName: runtimetests-desktop-$(SampleAppName)

  steps:
  - checkout: self
    clean: 'true'

  - template: templates/dotnet-install-linux.yml
    parameters:
      UnoCheckParameters: '--tfm net10.0-desktop'
  - template: templates/canary-updater.yml
  - template: templates/gitversion.yml

  - pwsh: |
      dotnet publish -c Release -f net10.0-desktop -p:TargetFrameworkOverride=desktop `
        $(ProjectPath)/$(SampleAppName).csproj `
        -bl:$(build.artifactstagingdirectory)/themes-build-$(ArtifactName).binlog
    displayName: Build Desktop Head - $(SampleAppName)

  - task: PublishBuildArtifacts@1
    displayName: Publish Build Logs
    condition: always()
    inputs:
      PathtoPublish: $(build.artifactstagingdirectory)/themes-build-$(ArtifactName).binlog
      ArtifactName: $(ArtifactName)-buildlog
      ArtifactType: Container

  - script: |
      chmod +x build/scripts/linux-skia-desktop-runtime-tests.sh
      build/scripts/linux-skia-desktop-runtime-tests.sh
    displayName: 'Run Runtime Tests - $(SampleAppName)'
    env:
      ProjectPath: '$(ProjectPath)'
      SampleAppName: '$(SampleAppName)'
      UNO_RUNTIME_TESTS_RUN_TESTS: '{}'
      UNO_RUNTIME_TESTS_OUTPUT_PATH: '$(Common.TestResultsDirectory)/runtime-tests-$(SampleAppName).xml'

  - task: PublishTestResults@2
    displayName: 'Publish Runtime Tests Results'
    condition: always()
    inputs:
      testRunTitle: 'Runtime Tests - $(SampleAppName)'
      testResultsFormat: 'NUnit'
      testResultsFiles: '$(Common.TestResultsDirectory)/runtime-tests-$(SampleAppName).xml'
      failTaskOnFailedTests: true

# ThemesSampleApp hosts the four theme heads in secondary ALCs; building alone cannot catch a
# hosting regression (this repo's history: a wasm payload that fetched HTTP 200 but failed to
# boot, and a Win32 run-loop bug X11 verification missed). This job actually loads every guest,
# unloads, and asserts per-cycle ALC reclamation via the wrapper's --smoke mode.
- job: HostingSmoke_Desktop
  cancelTimeoutInMinutes: 0
  displayName: 'Hosting Smoke - ThemesSampleApp Desktop'
  timeoutInMinutes: 30

  pool:
    vmImage: 'ubuntu-latest'

  steps:
  - checkout: self
    clean: 'true'

  - template: templates/dotnet-install-linux.yml
    parameters:
      UnoCheckParameters: '--tfm net10.0-desktop'
  - template: templates/canary-updater.yml
  - template: templates/gitversion.yml

  # TargetFrameworkOverride activates the wrapper's ordering ProjectReferences, building the
  # four guest heads first so their sibling bins exist for the runtime probe.
  - pwsh: |
      dotnet build -c Release -f net10.0-desktop -p:TargetFrameworkOverride=desktop `
        src/samples/ThemesSampleApp/ThemesSampleApp.csproj `
        -bl:$(build.artifactstagingdirectory)/themes-build-hosting-smoke.binlog
    displayName: Build ThemesSampleApp + guest heads

  - task: PublishBuildArtifacts@1
    displayName: Publish Build Logs
    condition: always()
    inputs:
      PathtoPublish: $(build.artifactstagingdirectory)/themes-build-hosting-smoke.binlog
      ArtifactName: hosting-smoke-buildlog
      ArtifactType: Container

  - script: |
      chmod +x build/scripts/linux-skia-desktop-hosting-smoke.sh
      build/scripts/linux-skia-desktop-hosting-smoke.sh
    displayName: 'Run Hosting Smoke - ThemesSampleApp'
