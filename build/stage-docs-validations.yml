jobs:
- job: spell_checking
  cancelTimeoutInMinutes: 0
  displayName: 'Spell Checking Validation'

  pool:
    vmImage: 'ubuntu-latest'

  steps:
  - checkout: self
    fetchDepth: 1
    clean: true

  - task: NodeTool@0
    inputs:
      versionSpec: '18.x'

  - bash: npm install -g cspell
    displayName: Install cSpell

  # Same exclusions as the markdown linter below: specs/ and .specify/ are internal working
  # notes (design specs, postmortems), not published documentation, and they carry runtime and
  # tooling jargon that does not belong in the shared dictionary.
  - bash: cspell --config $(Build.SourcesDirectory)/build/cspell.json --exclude "specs/**" --exclude ".specify/**" "**/*.md" "**/toc.yml" --no-progress
    displayName: Run Spell Checking

- job: markdown_link
  cancelTimeoutInMinutes: 0
  displayName: 'Markdown Validation'

  pool:
    vmImage: 'ubuntu-latest'

  steps:
  - checkout: self
    fetchDepth: 1
    clean: true

  - task: NodeTool@0
    inputs:
      versionSpec: '18.x'

  - bash: npm install -g markdownlint-cli
    displayName: Install markdownlint-cli

  - bash: markdownlint -c $(Build.SourcesDirectory)/build/.markdownlint.json --ignore ".specify/**" --ignore "specs/**" "**/*.md"
    displayName: Run Markdown Linter

- job: style_docs
  cancelTimeoutInMinutes: 0
  displayName: 'Style Docs Validation'

  pool:
    vmImage: 'ubuntu-latest'

  steps:
  - checkout: self
    fetchDepth: 1
    clean: true

  # Same SDK step as templates/dotnet-install-linux.yml (keep DotNetVersion in sync), without its
  # uno-check workload install: the generator is a plain .NET 10 file-based app.
  - task: UseDotNet@2
    displayName: 'Use .NET Core SDK 10.0.101'
    retryCountOnTaskFailure: 3
    inputs:
      packageType: sdk
      version: '10.0.101'

  # doc/styles/** tables are generated from the Styles XAML; fails when a page is out of date.
  - bash: dotnet run build/scripts/GenerateStyleDocs.cs -- --check
    displayName: Verify generated style docs
